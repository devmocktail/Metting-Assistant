# Fly.io config. From backend/:  fly launch --no-deploy   (then edit app name)
#   fly volumes create data --size 1
#   fly secrets set SESSION_SECRET=... ADMIN_TOKEN=... ADMIN_EMAILS=... GOOGLE_CLIENT_ID=... GOOGLE_CLIENT_SECRET=...
#   fly deploy
# Fly gives a small free volume, so the JSON store persists across restarts.
app = "meeting-assistant-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  AUTH_MODE = "google"
  STORE = "json"
  DATA_DIR = "/data"
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[mounts]]
  source = "data"
  destination = "/data"

# Render.com Blueprint. Render → New → Blueprint → connect this repo.
# Free web service. Free tier has no persistent disk, so this uses Upstash Redis
# (also free) for storage. SESSION_SECRET and ADMIN_TOKEN are generated by Render;
# fill the "sync: false" ones in the Render dashboard (values you create).
services:
  - type: web
    name: meeting-assistant-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node src/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: google
      - key: STORE
        value: upstash
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
